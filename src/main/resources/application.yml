spring:
  application:
    name: egastro-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/egastro}
    username: ${DB_USERNAME:egastro}
    password: ${DB_PASSWORD:egastro}
  jpa:
    hibernate:
      ddl-auto: create-drop

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

egastro:
  recommendations:
    ml:
      base-url: ${ML_SERVICE_URL:http://localhost:8000}
      connect-timeout: PT0.5S
      read-timeout: PT2S
    default-limit: 5
    max-limit: 20
  security:
    jwt:
      secret: ${JWT_SECRET:local-development-placeholder-secret-change-me-at-least-32-bytes}
      ttl: PT24H
    cors:
      allowed-origins:
        - http://localhost:3000
        - http://localhost:5173
  admin:
    email: ${ADMIN_EMAIL:admin@egastro.local}
    password: ${ADMIN_PASSWORD:Admin12345}
