services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: egastro
      POSTGRES_PASSWORD: egastro
      POSTGRES_DB: egastro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egastro -d egastro"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
